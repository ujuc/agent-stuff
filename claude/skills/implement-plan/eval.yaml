version: "1"
skill: implement-plan
tasks:
  - id: plan-state-integrity
    description: "After execution, plan file has exactly one of [x]/[ ]/[ ] (RESET) per original todo"
    success_criteria: "All todos accounted for, no duplicates or orphans"

  - id: flag-lifecycle
    description: "After completion, .plans/.implementing is removed"
    success_criteria: "File does not exist after Step 6"

  - id: verification-coverage
    description: "Every completed [x] item has a corresponding .plans/.verify-*.md artifact"
    success_criteria: "1:1 mapping between [x] items and verify files"

  - id: mode-selection
    description: "If Mode B was used, parallel items touched disjoint file sets"
    success_criteria: "Merge completed without conflicts"

  - id: composition-hygiene
    description: "On RESET, handoff to annotate-plan Phase B was made explicit to the user"
    success_criteria: "User directed to annotate-plan with reset notes; no inline redesign attempted"
