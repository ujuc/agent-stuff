# 플러그인 명령 → 그룹 매핑.
#
# SKILL.md frontmatter를 수정할 수 없는 플러그인 스킬을 8 그룹에 배치한다.
# 노출 가치 있는 명령만 등록 — 100여 개 전체를 다 넣지 않는다.
# 새 플러그인을 활성화하면 사용 빈도를 보고 1-2주 후 여기에 추가한다.

[planning]
commands = [
    "feature-dev:feature-dev",
]

[analysis]
commands = [
    "everything-claude-code:planner",
    "everything-claude-code:repo-scan",
]

[build]
commands = [
    "everything-claude-code:rust-build",
    "everything-claude-code:rust-test",
    "everything-claude-code:tdd",
    "superpowers:test-driven-development",
    "superpowers:subagent-driven-development",
]

[verify]
commands = [
    "code-review:code-review",
    "everything-claude-code:rust-review",
    "everything-claude-code:code-reviewer",
    "everything-claude-code:security-review",
    "everything-claude-code:e2e",
    "superpowers:verification-before-completion",
]

[docs]
commands = [
    "claude-md-management:revise-claude-md",
    "claude-md-management:claude-md-improver",
    "everything-claude-code:doc-updater",
    "init",
    "review",
]

[writing]
commands = [
    "everything-claude-code:article-writing",
    "everything-claude-code:content-engine",
]

[llm]
commands = [
    "amp-plugin-cc:amp-status",
    "amp-plugin-cc:amp-rescue",
    "amp-plugin-cc:amp-review",
    "amp-plugin-cc:amp-analyze",
    "amp-plugin-cc:amp-adversarial",
    "codex:setup",
    "codex:rescue",
]

[meta]
commands = [
    "amp-plugin-cc:amp-setup",
    "claude-hud:setup",
    "claude-hud:configure",
    "everything-claude-code:context-budget",
    "everything-claude-code:skill-health",
    "everything-claude-code:save-session",
    "everything-claude-code:resume-session",
    "schedule",
    "loop",
    "update-config",
    "fewer-permission-prompts",
    "simplify",
]
